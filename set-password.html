
<!DOCTYPE html>
<html lang="rw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set Password | T-MECHATRUCKS</title>
  <style>
    :root {
      --navy: #082b50;
      --orange: #ff8a00;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #082b50, #041628);
      font-family: Arial, sans-serif;
      color: #172536;
    }
    .card {
      width: 100%;
      max-width: 460px;
      padding: 30px;
      border-radius: 18px;
      background: white;
      box-shadow: 0 18px 50px #0005;
    }
    .logo {
      width: 76px;
      height: 76px;
      display: block;
      object-fit: contain;
      margin: 0 auto 12px;
    }
    h1 {
      text-align: center;
      color: var(--navy);
      font-size: 23px;
    }
    p { color: #52647b; line-height: 1.6; }
    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #aab9c8;
      border-radius: 9px;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: var(--navy);
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: wait; }
    a { color: var(--navy); }
    .center { text-align: center; }
    .hide { display: none; }
    #status { overflow-wrap: anywhere; }
    .error { color: #b42318 !important; }
    .success { color: #16713c !important; }
  </style>
</head>
<body>
  <main class="card">
    <img src="images/logo.webp"
         class="logo"
         alt="T-MechaTrucks Logo">

    <h1>Shyiraho Password Yawe</h1>

    <p id="intro">
      Turagenzura ubutumire bwawe...
    </p>

    <form id="passwordForm" class="hide">
      <label for="password">Password nshya</label>
      <input
        type="password"
        id="password"
        minlength="8"
        autocomplete="new-password"
        required
      >

      <label for="confirmPassword">
        Ongera wandike password
      </label>
      <input
        type="password"
        id="confirmPassword"
        minlength="8"
        autocomplete="new-password"
        required
      >

      <button type="submit" id="saveButton">
        Bika Password
      </button>
    </form>

    <p id="status" role="status" aria-live="polite"></p>

    <p class="center">
      <a href="login.html">Subira kuri Login</a>
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    (async function () {
      "use strict";

      const $ = id => document.getElementById(id);

      function message(text, success = false) {
        $("status").textContent = text;
        $("status").className = success ? "success" : "error";
      }

      if (!window.supabase) {
        message("Supabase ntiyafungutse. Reba internet.");
        return;
      }

      const db = window.supabase.createClient(
        "https://ivyzjzbtdlphjaeywtxa.supabase.co",
        "sb_publishable_8uDL-s41xR7B7KHlfWCovA_v7ixrNAP",
        {
          auth: {
            detectSessionInUrl: false,
            persistSession: true,
            autoRefreshToken: true
          }
        }
      );

      const query = new URLSearchParams(location.search);
      const hash = new URLSearchParams(
        location.hash.substring(1)
      );

      const errorDescription =
        query.get("error_description") ||
        hash.get("error_description") ||
        query.get("error") ||
        hash.get("error");

      if (errorDescription) {
        $("intro").textContent =
          "Ubutumire ntibwakunze.";
        message(errorDescription);
        return;
      }

      try {
        const code = query.get("code");

        const tokenHash =
          query.get("token_hash") ||
          hash.get("token_hash");

        const type =
          query.get("type") ||
          hash.get("type");

        const accessToken = hash.get("access_token");
        const refreshToken = hash.get("refresh_token");

        if (code) {
          const { error } =
            await db.auth.exchangeCodeForSession(code);

          if (error) throw error;

        } else if (tokenHash && type === "invite") {
          const { error } = await db.auth.verifyOtp({
            token_hash: tokenHash,
            type: "invite"
          });

          if (error) throw error;

        } else if (
          accessToken &&
          refreshToken &&
          type === "invite"
        ) {
          const { error } = await db.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken
          });

          if (error) throw error;

        } else {
          throw new Error(
            "Fungura iyi page ukoresheje link nshya y'ubutumire yo muri email."
          );
        }

        const {
          data: { user },
          error: userError
        } = await db.auth.getUser();

        if (userError || !user) {
          throw new Error(
            "Konti ntiyemejwe. Saba invitation nshya."
          );
        }

        // Remove invitation tokens from the visible URL.
        history.replaceState(
          null,
          "",
          location.pathname
        );

        $("intro").textContent =
          "Ubutumire bwemejwe. Shyiraho password " +
          "uzajya ukoresha winjira muri Dashboard.";

        $("passwordForm").classList.remove("hide");

      } catch (error) {
        $("intro").textContent =
          "Ntibyashobotse kwemeza ubutumire.";
        message(error.message);
        return;
      }

      $("passwordForm").addEventListener(
        "submit",
        async function (event) {
          event.preventDefault();

          const password = $("password").value;
          const confirm = $("confirmPassword").value;
          const button = $("saveButton");

          if (password.length < 8) {
            message("Password igomba kugira nibura inyuguti 8.");
            return;
          }

          if (password !== confirm) {
            message("Passwords ebyiri ntizihuye.");
            return;
          }

          button.disabled = true;
          button.textContent = "Birimo kubikwa...";

          try {
            const { error } = await db.auth.updateUser({
              password: password
            });

            if (error) throw error;

            $("passwordForm").classList.add("hide");

            $("intro").textContent =
              "Password yawe yabitswe neza.";

            message(
              "Password yabitswe! Turakujyana kuri Dashboard...",
              true
            );

            // Keep the authenticated session.
            // Dashboard must independently verify staff roles.
            window.location.replace(
              "admin-dashboard.html"
            );

          } catch (error) {
            message(
              error.message ||
              "Ntibyashobotse kubika password."
            );

            button.disabled = false;
            button.textContent = "Bika Password";
          }
        }
      );
    })();
  </script>
</body>
</html>
