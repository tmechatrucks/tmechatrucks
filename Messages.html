
<!doctype html>
<html lang="rw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#075e54">
<title>Messages | T-MECHATRUCKS</title>
<style>
:root{
  --green:#075e54;--green2:#128c7e;
  --lime:#dcf8c6;--navy:#082b50;
  --muted:#667781;--line:#e7ebed
}
*{box-sizing:border-box}
body{
  margin:0;background:#e5ddd5;
  font:14px/1.45 system-ui,-apple-system,Segoe UI,Arial,sans-serif;
  color:#111b21
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
a{text-decoration:none}
.app{
  height:100dvh;max-height:100dvh;
  display:grid;grid-template-columns:340px minmax(0,1fr);
  max-width:1600px;margin:auto;background:#fff;
  box-shadow:0 2px 30px #0002
}
.sidebar{
  border-right:1px solid var(--line);background:#fff;
  display:flex;flex-direction:column;min-width:0
}
.side-top{
  background:#f0f2f5;display:flex;align-items:center;
  gap:11px;padding:17px 16px;min-height:76px
}
.logo{
  width:43px;height:43px;border-radius:50%;
  background:#fff;object-fit:contain;border:1px solid #ddd
}
.brand{
  font-size:15px;font-weight:800;
  color:var(--navy);line-height:1.25
}
.small{font-size:12px;color:var(--muted)}
.tools{
  padding:14px;border-bottom:1px solid var(--line);
  display:flex;gap:8px;flex-wrap:wrap
}
.tool{
  padding:9px 12px;border-radius:8px;
  border:1px solid #d6dfe1;background:#fff;
  color:var(--navy);font-weight:700
}
.tool:hover{background:#f2f6f6}
.identity{padding:15px;border-bottom:1px solid var(--line)}
.identity strong{display:block}
.identity span{
  color:var(--muted);font-size:12px;overflow-wrap:anywhere
}
.thread{
  display:flex;align-items:center;gap:12px;
  padding:18px 15px;background:#edf6f2;
  border-left:4px solid #128c7e
}
.avatar{
  width:48px;height:48px;border-radius:50%;
  display:grid;place-items:center;background:#d9eee6;
  color:#075e54;font-size:22px;font-weight:800;flex-shrink:0
}
.thread strong{font-size:15px}
.thread p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.side-foot{
  margin-top:auto;padding:15px;font-size:12px;
  color:var(--muted);border-top:1px solid var(--line)
}
.chat{
  min-width:0;min-height:0;display:flex;
  flex-direction:column;background:#efeae2
}
.chat-head{
  height:76px;flex-shrink:0;background:#f0f2f5;
  display:flex;align-items:center;gap:12px;
  padding:12px 20px;border-bottom:1px solid #d9dfe1
}
.chat-head .details{flex:1;min-width:0}
.chat-head strong{display:block;font-size:16px}
.chat-head small{display:block;color:var(--muted)}
.head-actions{display:flex;gap:7px}
.iconbtn{
  border:0;background:transparent;border-radius:50%;
  width:38px;height:38px;font-size:20px;color:#54656f
}
.iconbtn:hover{background:#dfe6e6}
.searchbox{
  padding:10px 17px;background:#fff;
  border-bottom:1px solid var(--line);display:none
}
.searchbox.open{display:block}
.searchbox input{
  width:100%;padding:11px 13px;
  border:1px solid #d2dce0;border-radius:10px;outline:none
}
.notice{
  padding:9px 18px;background:#fff8df;color:#755600;
  font-size:12px;text-align:center;display:none
}
.notice.show{display:block}
.messages{
  flex:1;overflow:auto;
  padding:25px clamp(12px,5vw,80px);
  display:flex;flex-direction:column;gap:6px;
  scroll-behavior:smooth;background-color:#efeae2;
  background-image:radial-gradient(#cabda91f 1px,transparent 1px);
  background-size:22px 22px
}
.day{
  align-self:center;background:#fffdf9;
  padding:6px 12px;border-radius:8px;
  color:#54656f;font-size:11px;margin:13px 0 8px;
  box-shadow:0 1px 2px #0001
}
.bubble{
  position:relative;max-width:min(75%,600px);
  padding:8px 10px 6px;border-radius:9px;
  background:#fff;box-shadow:0 1px 1px #0002;
  overflow-wrap:anywhere;white-space:pre-wrap
}
.bubble.mine{
  align-self:flex-end;background:var(--lime);
  border-top-right-radius:2px
}
.bubble.other{
  align-self:flex-start;border-top-left-radius:2px
}
.sender{
  font-size:12px;font-weight:800;
  color:#8a3aab;margin-bottom:3px
}
.bubble.mine .sender{color:#087b5c}
.msgbody{line-height:1.5;font-size:14px}
.deleted .msgbody{color:#74838c;font-style:italic}
.meta{
  display:flex;justify-content:flex-end;
  align-items:center;gap:6px;margin-top:3px;
  color:#667781;font-size:10px
}
.delbtn{
  background:none;border:0;color:#8b4949;
  font-size:11px;padding:0 3px;text-decoration:underline
}
.composer{
  display:flex;gap:12px;align-items:flex-end;
  background:#f0f2f5;padding:11px 18px;flex-shrink:0
}
.composer textarea{
  flex:1;resize:none;min-height:44px;max-height:130px;
  padding:11px 14px;border:0;border-radius:10px;
  outline:none;background:white;line-height:1.5
}
.send{
  border:0;background:#128c7e;color:#fff;
  border-radius:50%;width:46px;height:46px;
  font-size:22px;flex-shrink:0
}
.send:hover{background:#075e54}
.empty{
  margin:auto;color:#687782;text-align:center;
  background:#fff9;padding:15px;border-radius:10px
}
.mobile-title{display:none}
.loading{margin:auto;text-align:center;color:#61727b}
.footer{
  padding:6px;text-align:center;font-size:10px;
  color:#667781;background:#f0f2f5
}
@media(max-width:750px){
  .app{grid-template-columns:1fr;height:100dvh}
  .sidebar{display:none}
  .chat-head{height:66px;padding:9px 12px}
  .messages{padding:14px 10px}
  .bubble{max-width:88%}
  .composer{padding:9px;gap:8px}
  .mobile-title{display:inline}
  .head-actions .tool{padding:6px 8px;font-size:11px}
  .chat-head .avatar{width:40px;height:40px;font-size:18px}
}
@media(min-width:751px){
  .mobile-back{display:none}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="side-top">
    <img class="logo" src="images/logo.webp"
         alt="T-MechaTrucks Logo"
         onerror="this.style.display='none'">
    <div>
      <div class="brand">T-MECHATRUCKS</div>
      <div class="small">Admin Messages</div>
    </div>
  </div>
  <div class="tools">
    <a class="tool" href="admin-dashboard.html">← Dashboard</a>
    <button class="tool" id="logout" type="button">Sohoka</button>
    <select class="tool" id="lang" aria-label="Language">
      <option value="rw">🇷🇼 RW</option>
      <option value="en">🇬🇧 EN</option>
    </select>
  </div>
  <div class="identity">
    <strong id="myname">Kugenzura login...</strong>
    <span id="myemail"></span>
  </div>
  <div class="thread">
    <div class="avatar">👥</div>
    <div>
      <strong>T-MECHATRUCKS Admin Group</strong>
      <p id="sideinfo">Ikiganiro cy'abayobozi bose</p>
    </div>
  </div>
  <div class="side-foot">
    🔒 Ubutumwa bugaragarira abayobozi bemerewe gusa.
  </div>
</aside>
<section class="chat">
  <div class="chat-head">
    <a class="iconbtn mobile-back" href="admin-dashboard.html"
       aria-label="Dashboard">‹</a>
    <div class="avatar">👥</div>
    <div class="details">
      <strong>T-MECHATRUCKS Admin Group</strong>
      <small id="members">Guhuza na Supabase...</small>
    </div>
    <div class="head-actions">
      <button class="iconbtn" id="searchToggle"
              title="Shaka ubutumwa" aria-label="Search">⌕</button>
      <a class="tool mobile-title" href="admin-dashboard.html">
        Dashboard
      </a>
    </div>
  </div>
  <div class="searchbox" id="searchbox">
    <input id="search" placeholder="Shaka ubutumwa cyangwa izina...">
  </div>
  <div class="notice" id="notice" role="alert"></div>
  <div class="messages" id="messages" aria-live="polite">
    <div class="loading">Turi gufungura ubutumwa...</div>
  </div>
  <form class="composer" id="form">
    <textarea id="body" rows="1" maxlength="2000"
              placeholder="Andika ubutumwa..." disabled required></textarea>
    <button class="send" id="send" type="submit" disabled
            title="Ohereza" aria-label="Ohereza">➤</button>
  </form>
  <div class="footer">
    T-MECHATRUCKS · Private Admin Group
  </div>
</section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>
<script>
(()=>{
'use strict';

const SUPABASE_URL='https://ivyzjzbtdlphjaeywtxa.supabase.co';
const SUPABASE_KEY='sb_publishable_8uDL-s41xR7B7KHlfWCovA_v7ixrNAP';
const $=id=>document.getElementById(id);

const dictionary={
  rw:{
    loading:'Turi gufungura ubutumwa...',
    empty:'Nta butumwa burimo. Tangira ikiganiro!',
    placeholder:'Andika ubutumwa...',
    members:'Ikiganiro cy’abayobozi bose',
    deleted:'Ubu butumwa bwasibwe',
    delete:'Siba',
    confirm:'Urashaka gusiba ubu butumwa kuri bose?',
    login:'Nta login ibonetse. Injira mbere muri Dashboard.',
    access:'Iyi chat igenewe abayobozi gusa.',
    error:'Ikibazo: ',
    sending:'Kohereza byanze: ',
    search:'Shaka ubutumwa cyangwa izina...',
    logout:'Sohoka'
  },
  en:{
    loading:'Loading messages...',
    empty:'No messages yet. Start the conversation!',
    placeholder:'Write a message...',
    members:'Group for all administrators',
    deleted:'This message was deleted',
    delete:'Delete',
    confirm:'Delete this message for everyone?',
    login:'No active session. Please log in first.',
    access:'Admins only.',
    error:'Error: ',
    sending:'Failed to send: ',
    search:'Search messages or names...',
    logout:'Log out'
  }
};

let lang=localStorage.getItem('tmecha-admin-language')==='en'?'en':'rw';
let db,me,people=[],items=[],busy=false,channel=null,loading=false;

const t=k=>dictionary[lang][k]||k;

function notice(msg){
  $('notice').textContent=msg;
  $('notice').classList.toggle('show',!!msg);
}

function nameOf(id){
  const p=people.find(x=>x.user_id===id);
  return p?.display_name||p?.email?.split('@')[0]||
    (id===me?.id?me.email?.split('@')[0]:'Admin')||'Admin';
}

function time(v){
  return new Intl.DateTimeFormat('en-GB',{
    timeZone:'Africa/Kigali',
    hour:'2-digit',
    minute:'2-digit'
  }).format(new Date(v));
}

function day(v){
  return new Intl.DateTimeFormat('en-GB',{
    timeZone:'Africa/Kigali',
    day:'numeric',
    month:'short',
    year:'numeric'
  }).format(new Date(v));
}

function node(tag,cls,txt){
  const e=document.createElement(tag);
  if(cls)e.className=cls;
  if(txt!==undefined)e.textContent=txt;
  return e;
}

function render(){
  const box=$('messages');
  const nearBottom=box.scrollHeight-box.scrollTop-box.clientHeight<110;
  box.replaceChildren();

  const term=$('search').value.trim().toLocaleLowerCase();
  const filtered=items.filter(m=>
    !term||
    (m.body||'').toLocaleLowerCase().includes(term)||
    nameOf(m.sender_id).toLocaleLowerCase().includes(term)
  );

  if(!filtered.length){
    box.append(node('div','empty',
      term?'Nta butumwa buhuye n’ibyo ushaka.':t('empty')));
    return;
  }

  let lastDay='';
  for(const m of filtered){
    const d=day(m.created_at);
    if(d!==lastDay){
      box.append(node('div','day',d));
      lastDay=d;
    }

    const mine=m.sender_id===me?.id;
    const b=node('div',
      'bubble '+(mine?'mine':'other')+(m.deleted_at?' deleted':''));

    b.append(node('div','sender',nameOf(m.sender_id)));
    b.append(node('div','msgbody',
      m.deleted_at?t('deleted'):m.body));

    const meta=node('div','meta');
    meta.append(node('span','',time(m.created_at)));

    if(mine&&!m.deleted_at&&
       Date.now()-new Date(m.created_at).getTime()<3600000){
      const del=node('button','delbtn',t('delete'));
      del.type='button';
      del.onclick=()=>remove(m.id);
      meta.append(del);
    }

    b.append(meta);
    box.append(b);
  }

  if(nearBottom||!box.dataset.loaded)
    box.scrollTop=box.scrollHeight;
  box.dataset.loaded='1';
}

function translate(){
  $('lang').value=lang;
  $('body').placeholder=t('placeholder');
  $('search').placeholder=t('search');
  $('logout').textContent=t('logout');
  $('sideinfo').textContent=t('members');
  $('members').textContent=t('members');
  render();
}

async function load(){
  if(loading)return;
  loading=true;
  try{
    const {data,error}=await db
      .from('admin_group_messages')
      .select('id,sender_id,body,created_at,deleted_at')
      .order('created_at',{ascending:false})
      .limit(300);

    if(error)throw error;

    const next=(data||[]).reverse();
    if(JSON.stringify(items)!==JSON.stringify(next)){
      items=next;
      render();
    }
    notice('');
  }catch(e){
    notice(t('error')+e.message);
  }finally{
    loading=false;
  }
}

async function remove(id){
  if(!confirm(t('confirm')))return;
  const {error}=await db.rpc('delete_admin_group_message',{
    p_message_id:id
  });
  if(error)notice(t('error')+error.message);
  else await load();
}

$('form').addEventListener('submit',async e=>{
  e.preventDefault();
  if(!me||busy)return;

  const body=$('body').value.trim();
  if(!body)return;

  busy=true;
  $('send').disabled=true;

  const {error}=await db
    .from('admin_group_messages')
    .insert({sender_id:me.id,body});

  busy=false;
  $('send').disabled=false;

  if(error){
    notice(t('sending')+error.message);
    return;
  }

  $('body').value='';
  $('body').style.height='44px';
  await load();
  $('messages').scrollTop=$('messages').scrollHeight;
  $('body').focus();
});

$('body').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){
    e.preventDefault();
    $('form').requestSubmit();
  }
});

$('body').addEventListener('input',()=>{
  const el=$('body');
  el.style.height='44px';
  el.style.height=Math.min(el.scrollHeight,130)+'px';
});

$('searchToggle').onclick=()=>{
  $('searchbox').classList.toggle('open');
  $('search').focus();
};
$('search').oninput=render;

$('lang').onchange=e=>{
  lang=e.target.value;
  localStorage.setItem('tmecha-admin-language',lang);
  translate();
};

$('logout').onclick=async()=>{
  if(db)await db.auth.signOut();
  location.href='login.html';
};

async function start(){
  translate();

  if(!window.supabase?.createClient)
    throw Error('Supabase library failed to load. Check internet.');

  db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

  const {data,error}=await db.auth.getUser();
  if(error||!data.user)throw Error(t('login'));
  me=data.user;

  const role=await db.from('user_roles')
    .select('role')
    .eq('user_id',me.id)
    .eq('role','admin')
    .maybeSingle();

  if(role.error||!role.data)throw Error(t('access'));

  const users=await db.from('admin_chat_users')
    .select('user_id,display_name,email');

  if(!users.error)people=users.data||[];

  $('myname').textContent=nameOf(me.id);
  $('myemail').textContent=me.email||'';
  $('body').disabled=false;
  $('send').disabled=false;

  await load();

  channel=db.channel('tmecha-group-web-'+me.id)
    .on('postgres_changes',{
      event:'*',
      schema:'public',
      table:'admin_group_messages'
    },()=>load())
    .subscribe();

  setInterval(()=>{
    if(!document.hidden)load();
  },7000);

  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden)load();
  });
}

start().catch(e=>{
  notice(e.message);
  $('messages').replaceChildren(node('div','empty',e.message));
  $('myname').textContent='Login required';
  $('members').textContent='Connection error';
});
})();
</script>
</body>
</html>
