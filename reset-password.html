<!DOCTYPE html>
<html lang="rw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Recover Password | T-MECHATRUCKS</title>
<style>:root{--navy:#082b50;--orange:#ff8a00}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#082b50,#041628);font-family:Arial,sans-serif;display:grid;place-items:center;padding:20px;color:#172536}.card{width:100%;max-width:460px;background:#fff;padding:30px;border-radius:18px;box-shadow:0 18px 50px #0005}.logo{width:76px;height:76px;object-fit:contain;display:block;margin:0 auto 12px}h1{text-align:center;color:var(--navy);font-size:23px;margin:8px 0}p{line-height:1.5;color:#52647b}label{display:block;font-weight:700;margin:16px 0 7px}input{width:100%;padding:13px;border:1px solid #aab9c8;border-radius:9px;font-size:16px}input:focus{outline:2px solid var(--orange)}button{border:0;border-radius:9px;background:var(--navy);color:#fff;padding:14px;font-weight:700;font-size:15px;width:100%;margin-top:18px;cursor:pointer}button:disabled{opacity:.5}a{color:var(--navy);font-weight:bold}.center{text-align:center}#status{min-height:24px;font-size:14px;overflow-wrap:anywhere}#status.error{color:#b42318}#status.ok{color:#16713c}.small{font-size:13px}.hide{display:none}</style></head>
<body><main class="card"><img src="images/logo.webp" class="logo" alt="T-MechaTrucks Logo"><h1>Hindura Password</h1><p id="intro">Turagenzura link yo muri email yawe...</p>
<form id="form" class="hide"><label for="pass">Password nshya</label><input id="pass" type="password" autocomplete="new-password" minlength="8" required placeholder="Nibura inyuguti 8"><label for="confirm">Ongera wandike password nshya</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" required><button id="save" type="submit">Bika Password Nshya</button></form>
<p id="status" role="status" aria-live="polite"></p><p class="center small"><a href="login.html">← Subira kuri Login</a></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(async()=>{'use strict';const $=id=>document.getElementById(id);const status=(msg,good=false)=>{$('status').textContent=msg;$('status').className=good?'ok':'error'};
if(!window.supabase){status('Supabase ntifungutse. Reba internet.');return}
const db=window.supabase.createClient('https://ivyzjzbtdlphjaeywtxa.supabase.co','sb_publishable_8uDL-s41xR7B7KHlfWCovA_v7ixrNAP');
const params=new URLSearchParams(location.search);const hash=new URLSearchParams(location.hash.substring(1));
if(params.get('error')||hash.get('error')){status(params.get('error_description')||hash.get('error_description')||'Link ntiyemewe cyangwa yararengeje igihe.');$('intro').textContent='Subira kuri Login ukande Forgot Password ubone link nshya.';return}
let verified=false;
try{
 const code=params.get('code');const token=params.get('token_hash');const type=params.get('type');
 if(code){const {error}=await db.auth.exchangeCodeForSession(code);if(error)throw error;verified=true}
 else if(token&&type==='recovery'){const {error}=await db.auth.verifyOtp({token_hash:token,type:'recovery'});if(error)throw error;verified=true}
 else if(hash.get('access_token')&&hash.get('refresh_token')){const {error}=await db.auth.setSession({access_token:hash.get('access_token'),refresh_token:hash.get('refresh_token')});if(error)throw error;verified=true}
 // Recovery links may have been consumed automatically by the Supabase client.
 const {data:{session}}=await db.auth.getSession();
 if(!session||(!verified&&type!=='recovery'&&hash.get('type')!=='recovery')){throw Error('Fungura iyi page ukoresheje link ya Forgot Password yoherejwe kuri email.')} 
 $('intro').textContent='Andika password nshya (inyuguti nibura 8).';$('form').classList.remove('hide');
}catch(e){$('intro').textContent='Link yo guhindura password ntiyakunze.';status(e.message||'Saba link nshya muri Forgot Password.');return}
$('form').addEventListener('submit',async e=>{e.preventDefault();const p=$('pass').value,c=$('confirm').value;if(p.length<8){status('Password igomba kugira nibura inyuguti 8.');return}if(p!==c){status('Passwords ebyiri ntizihuye.');return}const btn=$('save');btn.disabled=true;btn.textContent='Birimo kubikwa...';try{const {error}=await db.auth.updateUser({password:p});if(error)throw error;status('Password yahinduwe neza! Subira kuri Login winjire ukoresheje password nshya.',true);$('form').classList.add('hide');await db.auth.signOut()}catch(err){status(err.message||'Ntibyashobotse. Ongera ugerageze.');btn.disabled=false;btn.textContent='Bika Password Nshya'}});
})();
</script></body></html>
