
<!DOCTYPE html>
<html lang="rw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set Password | T-MECHATRUCKS</title>

  <style>
    :root {
      --navy: #082b50;
      --orange: #ff8a00;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #082b50, #041628);
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      padding: 20px;
      color: #172536;
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: #fff;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 18px 50px #0005;
    }

    .logo {
      width: 76px;
      height: 76px;
      object-fit: contain;
      display: block;
      margin: 0 auto 12px;
    }

    h1 {
      text-align: center;
      color: var(--navy);
      font-size: 23px;
      margin: 8px 0;
    }

    p {
      line-height: 1.5;
      color: #52647b;
    }

    label {
      display: block;
      font-weight: 700;
      margin: 16px 0 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #aab9c8;
      border-radius: 9px;
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid var(--orange);
    }

    button {
      border: 0;
      border-radius: 9px;
      background: var(--navy);
      color: #fff;
      padding: 14px;
      font-weight: 700;
      font-size: 15px;
      width: 100%;
      margin-top: 18px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    a {
      color: var(--navy);
      font-weight: bold;
    }

    .center {
      text-align: center;
    }

    .small {
      font-size: 13px;
    }

    .hide {
      display: none;
    }

    #status {
      min-height: 24px;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    #status.error {
      color: #b42318;
    }

    #status.ok {
      color: #16713c;
    }
  </style>
</head>

<body>
  <main class="card">

    <img
      src="images/logo.webp"
      class="logo"
      alt="T-MechaTrucks Logo"
    >

    <h1 id="title">Shyiraho Password</h1>

    <p id="intro">
      Turagenzura link yo muri email yawe...
    </p>

    <form id="form" class="hide">

      <label for="pass">Password nshya</label>
      <input
        id="pass"
        type="password"
        autocomplete="new-password"
        minlength="8"
        required
        placeholder="Nibura inyuguti 8"
      >

      <label for="confirm">
        Ongera wandike password nshya
      </label>

      <input
        id="confirm"
        type="password"
        autocomplete="new-password"
        minlength="8"
        required
      >

      <button id="save" type="submit">
        Bika Password Nshya
      </button>

    </form>

    <p id="status" role="status" aria-live="polite"></p>

    <p class="center small">
      <a href="login.html">Subira kuri Login</a>
    </p>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    (async () => {
      "use strict";

      const $ = id => document.getElementById(id);

      const showStatus = (message, success = false) => {
        $("status").textContent = message;
        $("status").className = success ? "ok" : "error";
      };

      const showError = message => {
        $("intro").textContent =
          "Link ntiyakunze. Saba indi link nshya.";
        showStatus(message);
      };

      if (!window.supabase) {
        showError(
          "Supabase ntiyafungutse. Reba internet yawe."
        );
        return;
      }

      const db = window.supabase.createClient(
        "https://ivyzjzbtdlphjaeywtxa.supabase.co",
        "sb_publishable_8uDL-s41xR7B7KHlfWCovA_v7ixrNAP",
        {
          auth: {
            detectSessionInUrl: false,
            persistSession: true,
            autoRefreshToken: true
          }
        }
      );

      const params = new URLSearchParams(
        window.location.search
      );

      const hash = new URLSearchParams(
        window.location.hash.substring(1)
      );

      const errorMessage =
        params.get("error_description") ||
        hash.get("error_description") ||
        params.get("error") ||
        hash.get("error");

      if (errorMessage) {
        showError(errorMessage);
        return;
      }

      let linkVerified = false;

      try {
        const code = params.get("code");

        const tokenHash =
          params.get("token_hash") ||
          hash.get("token_hash");

        const type =
          params.get("type") ||
          hash.get("type");

        const accessToken = hash.get("access_token");
        const refreshToken = hash.get("refresh_token");

        const allowedTypes = [
          "recovery",
          "invite"
        ];

        if (code) {

          const { error } =
            await db.auth.exchangeCodeForSession(code);

          if (error) throw error;

          linkVerified = true;

        } else if (
          tokenHash &&
          allowedTypes.includes(type)
        ) {

          const { error } = await db.auth.verifyOtp({
            token_hash: tokenHash,
            type: type
          });

          if (error) throw error;

          linkVerified = true;

        } else if (
          accessToken &&
          refreshToken &&
          allowedTypes.includes(type)
        ) {

          const { error } = await db.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken
          });

          if (error) throw error;

          linkVerified = true;

        } else if (
          allowedTypes.includes(type)
        ) {

          const {
            data: { session },
            error
          } = await db.auth.getSession();

          if (error) throw error;

          if (session) {
            linkVerified = true;
          }
        }

        if (!linkVerified) {
          throw new Error(
            "Fungura iyi page ukoresheje link ya Invite User cyangwa Forgot Password yoherejwe kuri email."
          );
        }

        const {
          data: { session },
          error: sessionError
        } = await db.auth.getSession();

        if (sessionError) throw sessionError;

        if (!session) {
          throw new Error(
            "Session ntiyabonetse. Saba link nshya."
          );
        }

        if (type === "invite") {
          $("title").textContent =
            "Shyiraho Password yawe";

          $("intro").textContent =
            "Konti yawe yemejwe. Shyiraho password uzakoresha winjira muri T-MechaTrucks Dashboard.";
        } else {
          $("title").textContent =
            "Hindura Password";

          $("intro").textContent =
            "Andika password nshya. Igomba kugira nibura inyuguti 8.";
        }

        $("form").classList.remove("hide");

      } catch (error) {
        showError(
          error.message ||
          "Ntibyashobotse kugenzura link."
        );
        return;
      }

      $("form").addEventListener(
        "submit",
        async event => {

          event.preventDefault();

          const password = $("pass").value;
          const confirmPassword = $("confirm").value;

          if (password.length < 8) {
            showStatus(
              "Password igomba kugira nibura inyuguti 8."
            );
            return;
          }

          if (password !== confirmPassword) {
            showStatus(
              "Passwords ebyiri ntizihuye."
            );
            return;
          }

          const button = $("save");

          button.disabled = true;
          button.textContent = "Birimo kubikwa...";

          try {

            const { error } = await db.auth.updateUser({
              password: password
            });

            if (error) throw error;

            $("form").classList.add("hide");

            $("intro").textContent =
              "Password yawe yabitswe neza.";

            showStatus(
              "Password yashyizweho neza! Subira kuri Login winjire ukoresheje email na password nshya.",
              true
            );

            await db.auth.signOut();

          } catch (error) {

            showStatus(
              error.message ||
              "Ntibyashobotse kubika password."
            );

            button.disabled = false;
            button.textContent =
              "Bika Password Nshya";
          }

        }
      );

    })();
  </script>
</body>
</html>
